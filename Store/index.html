<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- تحسينات محركات البحث واللغة العربية -->
    <title>منصة حكايات - عالم القصص والحكايات العربية</title>
    <meta name="description" content="منصتك الشاملة لقراءة ونشر واكتشاف أروع الحكايات والقصص المبوّبة مع نظام تفاعلي متكامل وحفظ تلقائي.">
    
    <!-- خط كايرو وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #06b6d4;
            --accent: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 12px 80px 12px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(to right, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .search-icon {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 15px 10px;
            border-radius: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .category-card:active {
            transform: scale(0.97);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 100%; height: 3px;
            background: linear-gradient(to left, var(--primary), var(--secondary));
        }

        .category-card i {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: var(--secondary);
        }

        .category-card h3 {
            font-size: 0.95rem;
            color: var(--text-color);
            margin-bottom: 2px;
        }

        .counter-badge {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .tab-btn.fav-tab.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-add-desktop {
            display: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .story-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            padding: 6px;
            cursor: pointer;
        }

        .fav-btn.is-favorite {
            color: var(--accent);
        }

        .card-clickable-area {
            cursor: pointer;
        }

        .story-tag {
            display: inline-block;
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .story-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .story-preview {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .read-more-text {
            color: #38bdf8;
            font-weight: 700;
            font-size: 0.85rem;
            display: block;
        }

        .story-actions {
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--glass-border);
            padding-top: 12px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid var(--glass-border);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .story-detail-page {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 16px;
            max-width: 850px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .story-detail-page.active {
            display: block;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .detail-title {
            font-size: 1.6rem;
            margin: 12px 0;
            color: #fff;
        }

        .detail-body {
            font-size: 1.1rem;
            line-height: 2;
            color: #f1f5f9;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 15px;
        }

        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 999;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
        }

        .mobile-nav-item i {
            font-size: 1.2rem;
        }

        .mobile-nav-item.active {
            color: var(--primary);
        }

        .mobile-nav-add-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -15px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.5);
            border: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            padding: 0;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e1b4b;
            border: 1px solid var(--glass-border);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        @media (min-width: 768px) {
            body {
                padding: 30px 15px;
            }
            header h1 {
                font-size: 2.8rem;
            }
            .categories-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .stories-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 25px;
            }
            .btn-add-desktop {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .mobile-nav {
                display: none;
            }
            .modal {
                align-items: center;
                padding: 20px;
            }
            .modal-content {
                border-radius: 24px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 15px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="mainView">
        <header>
            <h1><i class="fa-solid fa-book-open"></i> عالم القصص</h1>
            <p>منصتك الشاملة لقراءة ونشر واكتشاف أروع الحكايات</p>
        </header>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن قصة..." oninput="handleSearch()">
        </div>

        <div class="categories-grid">
            <div class="category-card" onclick="filterStories('قسم 1')">
                <i class="fa-solid fa-dragon"></i>
                <h3>قسم 1</h3>
                <div class="counter-badge" id="count-sec1">0</div>
            </div>
            <div class="category-card" onclick="filterStories('قسم 2')">
                <i class="fa-solid fa-user-ninja"></i>
                <h3>قسم 2</h3>
                <div class="counter-badge" id="count-sec2">0</div>
            </div>
            <div class="category-card" onclick="filterStories('قسم 3')">
                <i class="fa-solid fa-hat-wizard"></i>
                <h3>قسم 3</h3>
                <div class="counter-badge" id="count-sec3">0</div>
            </div>
            <div class="category-card" onclick="filterStories('قسم 4')">
                <i class="fa-solid fa-rocket"></i>
                <h3>قسم 4</h3>
                <div class="counter-badge" id="count-sec4">0</div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="tabs">
                <button class="tab-btn active" onclick="filterStories('الكل')">الكل</button>
                <button class="tab-btn fav-tab" onclick="filterStories('المفضلة')"><i class="fa-solid fa-heart"></i> المفضلة</button>
                <button class="tab-btn" onclick="filterStories('قسم 1')">قسم 1</button>
                <button class="tab-btn" onclick="filterStories('قسم 2')">قسم 2</button>
                <button class="tab-btn" onclick="filterStories('قسم 3')">قسم 3</button>
                <button class="tab-btn" onclick="filterStories('قسم 4')">قسم 4</button>
            </div>
            <button class="btn-add-desktop" onclick="openModal()"><i class="fa-solid fa-plus"></i> قصة جديدة</button>
        </div>

        <div class="stories-grid" id="storiesContainer"></div>
    </div>

    <div class="story-detail-page" id="detailView">
        <button class="back-btn" onclick="showMainView()"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</button>
        <div id="storyDetailContent"></div>
    </div>

</div>

<div class="mobile-nav">
    <button class="mobile-nav-item active" onclick="filterStories('الكل'); showMainView();">
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
    </button>
    <button class="mobile-nav-add-btn" onclick="openModal()">
        <i class="fa-solid fa-plus" style="font-size: 1.2rem;"></i>
    </button>
    <button class="mobile-nav-item" onclick="filterStories('المفضلة'); showMainView();">
        <i class="fa-solid fa-heart"></i>
        <span>المفضلة</span>
    </button>
</div>

<div class="modal" id="storyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fa-solid fa-pen-nib"></i> إضافة قصة</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="storyForm">
            <input type="hidden" id="storyId">
            <div class="form-group">
                <label>عنوان القصة</label>
                <input type="text" id="title" required placeholder="أدخل العنوان...">
            </div>
            <div class="form-group">
                <label>اختر القسم</label>
                <select id="category" required>
                    <option value="قسم 1">قسم 1</option>
                    <option value="قسم 2">قسم 2</option>
                    <option value="قسم 3">قسم 3</option>
                    <option value="قسم 4">قسم 4</option>
                </select>
            </div>
            <div class="form-group">
                <label>محتوى القصة الكامل</label>
                <textarea id="content" rows="5" required placeholder="اكتب القصة هنا..."></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="action-btn btn-edit" onclick="closeModal()">إلغاء</button>
                <button type="submit" class="btn-add-desktop" style="display: flex; border-radius: 10px;">حفظ القصة</button>
            </div>
        </form>
    </div>
</div>

<script>
    // استخدام قاعدة بيانات جديدة v2 لمنع تداخل التخزين القديم
    const DB_NAME = 'HikayatStoriesDB_v2';
    const DB_VERSION = 1;
    const STORE_NAME = 'stories';
    let db = null;

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = (e) => {
                const dbInstance = e.target.result;
                if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
                    dbInstance.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };

            request.onsuccess = (e) => {
                db = e.target.result;
                resolve(db);
            };

            request.onerror = (e) => {
                console.error("IndexedDB error:", e.target.error);
                reject(e.target.error);
            };
        });
    }

    function getAllStoriesFromDB() {
        return new Promise((resolve) => {
            if (!db) return resolve([]);
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => resolve([]);
        });
    }

    function saveStoryToDB(story) {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put(story);
            tx.oncomplete = () => resolve();
        });
    }

    function deleteStoryFromDB(id) {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.delete(id);
            tx.oncomplete = () => resolve();
        });
    }

    let stories = [];
    let currentFilter = 'الكل';
    let searchQuery = '';

    const initialDefaultStories = [
        { 
            id: '1', 
            title: 'رحلة إلى الأعماق', 
            category: 'قسم 1', 
            isFavorite: true,
            content: `في قرية بعيدة كان هناك شاب يدعى جاك، وكان جاك يعيش مع والدته، إلّا أنهما لم يكونا يملكان إلا بقرة وحيدة نحيفة لا تدر الكثير من اللبن، فطلبت الأم من جاك أن يصطحب البقرة إلى السوق ليبيعها، لأنهما لا يملكان المال لشراء الطعام.

وفي الطريق التقى جاك برجل عجوز عرض عليه استبدال البقرة بحبات فاصولياء سحرية! رفض جاك في بداية الأمر لكن العجوز أقنعه بأنها حبات استثنائية. 

عندما عاد جاك إلى المنزل غضبت أمه كثيراً وركبت الحبات خارج النافذة. في الصباح التالي، استيقظ جاك ليجد شجرة فاصولياء عملاقة قد نمت حتى وصلت إلى السحاب! تسلق جاك الشجرة واكتشف قلعة عملاقة في السماء.` 
        }
    ];

    async function loadData() {
        await initDB();
        stories = await getAllStoriesFromDB();

        // فحص صارم: إذا كانت قاعدة البيانات فارغة تماماً، ولم يتم تسجيل علمية تهيئة مسبقة في localStorage
        const hasStartedBefore = localStorage.getItem('hikayat_ever_started');

        if (!hasStartedBefore) {
            // أول مرة يفتح المستخدم الموقع نهائياً
            if (stories.length === 0) {
                for (const s of initialDefaultStories) {
                    await saveStoryToDB(s);
                }
                stories = await getAllStoriesFromDB();
            }
            localStorage.setItem('hikayat_ever_started', 'true');
        }

        updateCounters();
        renderStories();
    }

    function updateCounters() {
        const counts = { 'قسم 1': 0, 'قسم 2': 0, 'قسم 3': 0, 'قسم 4': 0 };
        stories.forEach(s => { if(counts[s.category] !== undefined) counts[s.category]++; });

        document.getElementById('count-sec1').innerText = counts['قسم 1'];
        document.getElementById('count-sec2').innerText = counts['قسم 2'];
        document.getElementById('count-sec3').innerText = counts['قسم 3'];
        document.getElementById('count-sec4').innerText = counts['قسم 4'];
    }

    async function toggleFavorite(id, event) {
        if(event) event.stopPropagation();
        const story = stories.find(s => s.id === id);
        if (story) {
            story.isFavorite = !story.isFavorite;
            await saveStoryToDB(story);
            renderStories();
        }
    }

    function renderStories() {
        const container = document.getElementById('storiesContainer');
        container.innerHTML = '';

        const filteredList = stories.filter(s => {
            let matchesCategory = false;

            if (currentFilter === 'الكل') {
                matchesCategory = true;
            } else if (currentFilter === 'المفضلة') {
                matchesCategory = !!s.isFavorite;
            } else {
                matchesCategory = (s.category === currentFilter);
            }

            const matchesSearch = searchQuery === '' || 
                s.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                s.content.toLowerCase().includes(searchQuery.toLowerCase());
            
            return matchesCategory && matchesSearch;
        });

        if(filteredList.length === 0) {
            const emptyMsg = currentFilter === 'المفضلة' 
                ? 'لا توجد قصص مضافة في المفضلة بعد!' 
                : 'لا توجد قصص مطابقة!';

            container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-heart-crack" style="font-size: 2.5rem; margin-bottom: 8px; color: var(--accent);"></i>
                    <h4>${emptyMsg}</h4>
                </div>`;
            return;
        }

        filteredList.forEach(story => {
            const card = document.createElement('div');
            card.className = 'story-card';

            const previewText = story.content.length > 70 
                ? story.content.substring(0, 70) + '...' 
                : story.content;

            const isFav = story.isFavorite ? 'is-favorite' : '';
            const favIconClass = story.isFavorite ? 'fa-solid' : 'fa-regular';

            const headerArea = document.createElement('div');
            headerArea.className = 'card-header';
            headerArea.innerHTML = `
                <span class="story-tag">${story.category}</span>
                <button class="fav-btn ${isFav}" onclick="toggleFavorite('${story.id}', event)">
                    <i class="${favIconClass} fa-heart"></i>
                </button>
            `;

            const contentArea = document.createElement('div');
            contentArea.className = 'card-clickable-area';
            contentArea.innerHTML = `
                <h3 class="story-title">${story.title}</h3>
                <p class="story-preview">${previewText}</p>
                <span class="read-more-text">اقرأ المزيد <i class="fa-solid fa-arrow-left"></i></span>
            `;

            contentArea.addEventListener('click', () => {
                viewStory(story.id);
            });

            const actionsArea = document.createElement('div');
            actionsArea.className = 'story-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'action-btn btn-edit';
            editBtn.innerHTML = `<i class="fa-solid fa-pen"></i> تعديل`;
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                editStory(story.id);
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-btn btn-delete';
            deleteBtn.innerHTML = `<i class="fa-solid fa-trash"></i> حذف`;
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteStory(story.id);
            });

            actionsArea.appendChild(editBtn);
            actionsArea.appendChild(deleteBtn);

            card.appendChild(headerArea);
            card.appendChild(contentArea);
            card.appendChild(actionsArea);
            container.appendChild(card);
        });
    }

    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value.trim();
        renderStories();
    }

    function viewStory(id) {
        const story = stories.find(s => s.id === id);
        if (story) {
            const isFav = story.isFavorite ? 'is-favorite' : '';
            const favIconClass = story.isFavorite ? 'fa-solid' : 'fa-regular';

            const detailContainer = document.getElementById('storyDetailContent');
            detailContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="story-tag">${story.category}</span>
                    <button class="fav-btn ${isFav}" onclick="toggleFavorite('${story.id}', event); viewStory('${story.id}');">
                        <i class="${favIconClass} fa-heart"></i>
                    </button>
                </div>
                <h1 class="detail-title">${story.title}</h1>
                <hr style="border-color: var(--glass-border); margin: 12px 0;">
                <div class="detail-body">${story.content}</div>
            `;

            document.getElementById('mainView').style.display = 'none';
            document.getElementById('detailView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function showMainView() {
        document.getElementById('detailView').classList.remove('active');
        document.getElementById('mainView').style.display = 'block';
    }

    function filterStories(cat) {
        currentFilter = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(cat));
        });
        renderStories();
    }

    function openModal() {
        document.getElementById('storyForm').reset();
        document.getElementById('storyId').value = '';
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-nib"></i> إضافة قصة جديدة';
        document.getElementById('storyModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('storyModal').classList.remove('active');
    }

    document.getElementById('storyForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const id = document.getElementById('storyId').value || Date.now().toString();
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const content = document.getElementById('content').value;

        const existingStory = stories.find(s => s.id === id);
        const isFavorite = existingStory ? !!existingStory.isFavorite : false;

        const storyObj = { id, title, category, content, isFavorite };
        await saveStoryToDB(storyObj);
        
        stories = await getAllStoriesFromDB();
        updateCounters();
        renderStories();
        closeModal();
    });

    function editStory(id) {
        const story = stories.find(s => s.id === id);
        if(story) {
            document.getElementById('storyId').value = story.id;
            document.getElementById('title').value = story.title;
            document.getElementById('category').value = story.category;
            document.getElementById('content').value = story.content;
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> تعديل القصة';
            document.getElementById('storyModal').classList.add('active');
        }
    }

    async function deleteStory(id) {
        if(confirm('هل أنت متأكد من حذف هذه القصة؟')) {
            await deleteStoryFromDB(id);
            stories = await getAllStoriesFromDB();
            updateCounters();
            renderStories();
        }
    }

    window.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
